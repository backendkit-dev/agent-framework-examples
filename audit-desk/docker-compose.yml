# A throwaway Redis for `npm run redis:check`. Nothing is persisted: `down` removes it.
services:
  redis:
    image: redis:7-alpine
    container_name: audit-desk-redis
    ports:
      - "127.0.0.1:6390:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15
